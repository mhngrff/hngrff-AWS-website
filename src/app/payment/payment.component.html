

  <div class="order-summary-container">

    <div class="order-summary-items">
      <div *ngIf="cartItems.length > 0" class="payment-items">
        <div *ngFor="let item of cartItems" class="payment-item">
          <img [src]="item.thumbnailUrl" [alt]="item.optionSubtitle" class="payment-thumbnail">

          <div class="subtitle-quantity-price">
            <p>{{ item.optionSubtitle }}
            <span class="quantity"> x {{ item.quantity }}</span> &nbsp;
            <span class="price">{{ item.price | currency }}</span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="edit-cart-subtotal-row">
      <div *ngIf="!isBuyNowFlow$">
        <a  (click)="editCart()" class="edit-cart-text">Edit cart</a>
      </div>

      <div class="order-summary-total">
        <h3>Subtotal: {{ total | currency }}</h3>
      </div>

    </div>
  </div>

  <div class="payment-container">
    <form id="payment-form" (submit)="handlePayment($event)">

      <!-- Email Field -->
      <label for="email" class="email-label">Email</label>
      <div class="email-field">
        <input type="email" id="email" name="email" required />
      </div>

      <!-- Shipping Address Fields -->
      <h3 class="section-heading">Shipping Information</h3>

      <div class="address-row">
        <input type="text" id="shipping-name" name="shippingName" placeholder="Full Name" required />
      </div>

      <div class="address-row">
        <input type="text" id="address-line1" name="addressLine1" placeholder="Address Line 1" required />
<!--        <input type="text" id="address-line2" name="addressLine2" placeholder="Address Line 2 (Optional)" />-->
      </div>

      <div class="address-row">
<!--        <input type="text" id="address-line1" name="addressLine1" placeholder="Address Line 1" required />-->
                <input type="text" id="address-line2" name="addressLine2" placeholder="Address Line 2 (Optional)" />
      </div>

      <div class="address-row">
        <input type="text" id="city" name="city" placeholder="City" required />
        <input type="text" id="state" name="state" placeholder="State/Province" required />
      </div>

      <div class="address-row">
        <input type="text" id="zip" name="zip" placeholder="Zip/Postal Code" required />
        <select id="country" name="country" required>
          <option value="">Select Country</option>
          <option value="US">United States</option>
          <option value="CA">Canada</option>
          <!-- Add more countries as needed -->
        </select>
      </div>

      <!-- Cardholder Name -->
      <label for="cardholder-name" class="cardholder-name-label">Cardholder Name</label>
      <div class="cardholder-name-field">
        <input id="cardholder-name" placeholder="Full Name on Card" required />
      </div>

      <!-- Stripe Elements for Card Details -->
      <div class="card-info-label">
        <span>Card Information</span>
      </div>
      <div class="card-information">
        <div class="card-number-row">
          <div class="card-number-input" id="card-number-element"></div>
          <div class="card-icons">
            <img src="assets/images/discover.png" alt="discover" class="card-icon" data-card-type="discover" />
            <img src="assets/images/visa.png" alt="visa" class="card-icon" data-card-type="visa" />
            <img src="assets/images/master.png" alt="master" class="card-icon" data-card-type="master" />
            <img src="assets/images/amex.png" alt="amex" class="card-icon" data-card-type="amex" />
          </div>
        </div>

        <div class="expiration-cvc-row">
          <div class="expiration-input" id="card-expiry-element"></div>
          <div class="divider"></div>
          <div class="cvc-input" id="card-cvc-element"></div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-button">Pay</button>
    </form>
  </div>
